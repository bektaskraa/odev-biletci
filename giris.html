<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biletçi - Giriş Yap</title>
    <!-- Bootstrap CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" id="mainNavbar">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger fs-3" href="index.html">BİLETÇİ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#konserler">Konserler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="hakkimizda.html">Hakkımızda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="iletisim.html">İletişim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="giris.html">Giriş Yap</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Giriş Formu -->
    <main class="container mt-4">
        <div class="row">
            <div class="col-3"> </div>
            <div class="col-md-6">
                <div style="background-color: #1a1d20" class="card text-white border-0 mt-5">
                    <div class="card-body">
                        <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">Giriş Yap</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab" aria-controls="pills-register" aria-selected="false">Kayıt Ol</button>
                            </li>
                        </ul>
                        
                        <div class="tab-content" id="pills-tabContent">
                            <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab">
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label">E-posta</label>
                                        <input type="email" class="form-control" placeholder="E-posta adresiniz">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Şifre</label>
                                        <input type="password" class="form-control" placeholder="Şifreniz">
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="hatirla">
                                        <label class="form-check-label" for="hatirla">Beni Hatırla</label>
                                    </div>
                                    <button type="submit" class="btn btn-danger w-100 fw-bold">Giriş Yap</button>
                                </form>
                            </div>
                            
                            <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="pills-register-tab">
                                <form>
                                    <div class="mb-3">
                                        <label class="form-label">Ad Soyad</label>
                                        <input type="text" class="form-control" placeholder="Adınız Soyadınız">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">E-posta</label>
                                        <input type="email" class="form-control" placeholder="E-posta adresiniz">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Şifre</label>
                                        <input type="password" class="form-control" placeholder="Şifreniz">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Şifre Tekrar</label>
                                        <input type="password" class="form-control" placeholder="Şifrenizi tekrar girin">
                                    </div>
                                    <button type="submit" class="btn btn-danger w-100 fw-bold">Kayıt Ol</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="col-3"> </div>
        </div>
    </main>

    <footer class="bg-dark text-center text-muted py-4 mt-5 border-top border-secondary">
        <div class="container">
            <p class="mb-0">&copy; 1822 - 2026 BİLETÇİ. Tüm Hakları Saklıdır.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
